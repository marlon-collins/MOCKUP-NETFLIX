<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser - Netflix</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { background-color: #141414; color: white; font-family: Arial, sans-serif; }
        header { background-color: #141414; padding: 15px 4%; border-bottom: 1px solid #222; position: fixed; width: 100%; top: 0; z-index: 100; }
        .menu-principal { display: flex; align-items: center; justify-content: space-between; }
        .logo-container img { width: 100px; display: block; }
        nav ul { display: flex; list-style: none; gap: 15px; }
        nav ul li a { color: #aaa; text-decoration: none; font-size: 13px; font-weight: bold; }
        nav ul li a.active { color: #fff; }
        
        main { margin-top: 90px; padding: 30px 4%; display: flex; flex-direction: column; gap: 25px; }
        .browser-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; padding-bottom: 10px; }
        .browser-header h1 { font-size: 24px; color: #fff; }
        .tags-filtro { display: flex; gap: 10px; }
        .tag { background: #222; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #444; }
        .tag:hover { background: #e50914; border-color: #e50914; }

        .grid-browser { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card-browser { background: #1f1f1f; border-radius: 6px; overflow: hidden; transition: transform 0.3s; }
        .card-browser:hover { transform: scale(1.05); }
        .card-browser img { width: 100%; height: 240px; object-fit: cover; }
        .card-browser p { padding: 10px; font-size: 13px; text-align: center; }

        footer { background: #141414; padding: 30px 4%; color: #777; text-align: center; margin-top: 50px; font-size: 12px; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <div class="menu-principal">
            <div class="logo-container"><img src="../imagens/Icones/NETFLIX.jpg" alt="Logo"></div>
            <nav>
                <ul>
                    <li><a href="../html/home.html"> HOME  </a></li>
                    <li><a href="tvshows.html">TV SHOWS</a></li>
                    <li><a href="movies.html">MOVIES</a></li>
                    <li><a href="games.html">GAMES</a></li>
                    <li><a href="news&popular.html">NEWS & POPULAR</a></li>
                    <li><a href="mylist.html">MY LIST</a></li>
                    <li><a href="browser.html" class="active">BROWSER</a></li>
                </ul>
            </nav>
            <div style="font-size: 16px;">🔍 🔔 👤</div>
        </div>
    </header>

    <main>
        <div class="browser-header">
            <h1>Explorar Catálogo Completo</h1>
            <div class="tags-filtro">
                <span class="tag">Todos</span>
                <span class="tag">Ação</span>
                <span class="tag">Drama</span>
                <span class="tag">Ficção</span>
            </div>
        </div>
        <div class="grid-browser">
            <div class="card-browser"><img src="../imagens/filmes/filme1.jpg" alt=""><p>Título 01</p></div>
            <div class="card-browser"><img src="../imagens/filmes/filme2.jpg" alt=""><p>Título 02</p></div>
            <div class="card-browser"><img src="../imagens/filmes/filme3.jpg" alt=""><p>Título 03</p></div>
            <div class="card-browser"><img src="../imagens/filmes/filme4.jpg" alt=""><p>Título 04</p></div>
        </div>
    </main>

    <footer>@content direitos reservados</footer>
</body>
</html>
