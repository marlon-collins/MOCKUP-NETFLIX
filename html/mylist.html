<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List - Netflix</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { background-color: #141414; color: white; font-family: Arial, sans-serif; }
        header { background-color: #141414; padding: 15px 4%; border-bottom: 1px solid #222; position: fixed; width: 100%; top: 0; z-index: 100; }
        .menu-principal { display: flex; align-items: center; justify-content: space-between; }
        .logo-container img { width: 100px; display: block; }
        nav ul { display: flex; list-style: none; gap: 15px; }
        nav ul li a { color: #aaa; text-decoration: none; font-size: 13px; font-weight: bold; }
        nav ul li a.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 3px; }

        main { margin-top: 110px; padding: 20px 4%; display: flex; flex-direction: column; gap: 20px; min-height: 50vh; }
        h1 { font-size: 26px; }
        
        .minha-lista-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .item-lista { background: #1a1a1a; border-radius: 6px; overflow: hidden; position: relative; }
        .item-lista img { width: 100%; height: 230px; object-fit: cover; }
        .remover-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: none; padding: 4px 8px; border-radius: 50%; cursor: pointer; }

        footer { background: #141414; padding: 30px 4%; color: #777; text-align: center; margin-top: 50px; font-size: 12px; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <div class="menu-principal">
            <div class="logo-container"><img src="../imagens/Icones/NETFLIX.jpg" alt="Logo"></div>
            <nav>
                <ul>
                    <li><a href="../html/home.html"> HOME  </a></li>
                    <li><a href="tvshows.html">TV SHOWS</a></li>
                    <li><a href="movies.html">MOVIES</a></li>
                    <li><a href="games.html">GAMES</a></li>
                    <li><a href="news&popular.html">NEWS & POPULAR</a></li>
                    <li><a href="mylist.html" class="active">MY LIST</a></li>
                    <li><a href="browser.html">BROWSER</a></li>
                </ul>
            </nav>
            <div style="font-size: 16px;">🔍 🔔 👤</div>
        </div>
    </header>

    <main>
        <h1>❤️ Minha Lista de Favoritos</h1>
        <div class="minha-lista-grid">
            <div class="item-lista"><button class="remover-btn">✕</button><img src="../imagens/filmes/filme13.jpg" alt=""></div>
            <div class="item-lista"><button class="remover-btn">✕</button><img src="../imagens/filmes/filme14.jpg" alt=""></div>
            <div class="item-lista"><button class="remover-btn">✕</button><img src="../imagens/filmes/filme15.jpg" alt=""></div>
        </div>
    </main>

    <footer>@content direitos reservados</footer>
</body>
</html>
