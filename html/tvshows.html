<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Shows - Netflix</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { background-color: #141414; color: white; font-family: Arial, sans-serif; }
        header { background-color: #141414; padding: 15px 4%; border-bottom: 1px solid #222; position: fixed; width: 100%; top: 0; z-index: 100; }
        .menu-principal { display: flex; align-items: center; justify-content: space-between; }
        .logo-container img { width: 100px; display: block; }
        nav ul { display: flex; list-style: none; gap: 15px; }
        nav ul li a { color: #aaa; text-decoration: none; font-size: 13px; font-weight: bold; }
        nav ul li a.active { color: #fff; background: #333; padding: 4px 10px; border-radius: 4px; }

        main { margin-top: 90px; padding: 30px 4%; display: flex; flex-direction: column; gap: 25px; }
        .series-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .serie-card { min-width: 170px; border-radius: 6px; overflow: hidden; background: #1f1f1f; }
        .serie-card img { width: 100%; height: 240px; object-fit: cover; }
        .serie-card p { padding: 8px; font-size: 13px; text-align: center; }

        footer { background: #141414; padding: 30px 4%; color: #777; text-align: center; margin-top: 50px; font-size: 12px; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <div class="menu-principal">
            <div class="logo-container"><img src="../imagens/Icones/NETFLIX.jpg" alt="Logo"></div>
            <nav>
                <ul>
                    <li><a href="../html/home.html"> HOME  </a></li>
                    <li><a href="tvshows.html" class="active">TV SHOWS</a></li>
                    <li><a href="movies.html">MOVIES</a></li>
                    <li><a href="games.html">GAMES</a></li>
                    <li><a href="news&popular.html">NEWS & POPULAR</a></li>
                    <li><a href="mylist.html">MY LIST</a></li>
                    <li><a href="browser.html">BROWSER</a></li>
                </ul>
            </nav>
            <div style="font-size: 16px;">🔍 🔔 👤</div>
        </div>
    </header>

    <main>
        <h1>📺 Séries aclamadas pela crítica</h1>
        <div class="series-grid">
            <div class="serie-card"><img src="../imagens/filmes/filme18.jpg" alt=""><p>Temporada 1</p></div>
            <div class="serie-card"><img src="../imagens/filmes/filme19.jpg" alt=""><p>Temporada 3</p></div>
            <div class="serie-card"><img src="../imagens/filmes/filme20.jpg" alt=""><p>Minissérie</p></div>
            <div class="serie-card"><img src="../imagens/filmes/filme21.png" alt=""><p>Temporada 2</p></div>
        </div>
    </main>

    <footer>@content direitos reservados</footer>
</body>
</html>
