<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(20, 20, 20);
            color: white;
        }

        header {
            background-color: rgb(20, 20, 20);
            padding: 15px;
            color: white;
        }

        h1{
            text-align: center;
        }
        
/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/
        /*DIV DO CONTAINER MENU PRINCIPAL*/
        .menu-principal {
            display: flex;
            flex-direction: row;
            justify-content: space-between;            
        }

        
        /*IMAGEM ESQUERDA DO MENU*/
        .mini-logo{
            width: 200px;
            height: auto;
            border: green;            
            display: flex;            
        }
        .mini-logo img{
            width: 100px;
            height: auto;
            object-fit: contain;
        }

        /*MENU CENTRAL*/
        .menu-nav {
            display: flex;
            border-radius: 8px;
            padding: 10px;

        }
        .menu-nav nav ul {
            display: flex;
            flex-direction: row;
            padding: 10px;
            list-style: none;
            color: white;
            gap: 10px;            
        }
        .menu-nav ul li{
            display: flex;
            flex-direction: row;
            text-decoration: none;
            margin: 10px;
            padding: 10px;
            color: white;
        }

        .menu-nav nav ul li a{
            text-align: center;
            text-decoration: none;
            color: white;
        }
        .menu-nav nav ul li:hover{
            background-color: rgb(161, 10, 10);
        }



        /*MINM MENU DIREITA*/
        .mini-menu {
            /*background-color: black;*/
            display: flex;
        }
        .mini-menu ul{
            display: flex;
            flex-direction: row;
            list-style: none;
        }
        .mini-menu ul li{
            display: flex;
            flex-direction: row;
            margin: 10px;
        }
/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/

/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/
        /*MAIN*/
        main{
            display: flex;
            flex-direction: column;
            margin: 10px;
            gap: 10px;
        }



/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/
        /* BLOCO DE CARDS ONDE VEM A IMAGEME A DESCRIÇÃO*/

        .rei-cards {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            margin: 15px;
            padding: 15px;
        }

        .container-principal{
            display: flex;
            flex-direction: row;
            background-color: black;
            padding: 15px;
            border: 5px solid white;
            border-radius: 5px;
            width: 800px;            
            margin: 15px auto;
            gap: 10px;
        }

        /*box-shadow: 12px 0 20px black;	Sombra deslocada para a direita
        box-shadow: -12px 0 20px black;	Sombra deslocada para a esquerda
        box-shadow: 0 12px 20px black;	Sombra deslocada para baixo
        box-shadow: 0 -12px 20px black;	Sombra deslocada para cima
        box-shadow: 0 0 20px black;	Sombra sem deslocamento, espalhada ao redor*/
        .container-principal:hover {
            box-shadow: 0 4px 6px rgba(148, 12, 12, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;/*  Impede que o card "pule", garantindo que o movimento de subida e retorno seja flúido.*/
            transform: translateY(-8px);/* Move o elemento 8 pixels para cima no eixo vertical(para os lados) quando ocorre o :hover. (Valores negativos sobem, positivos descem = se invertem ).*/
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);/* colocacamos diferentes valores pro efeito 1º valor — deslocamento horizontal (X), 2º valor — deslocamento vertical (Y), sempre conta da esquerda pra direita primeiro e de cima para baixo o segundo e assim por diante*/
        }

        /*  1ª CAPA DO CARD LADO ESQUERDO*/
        .capa-filme{
            display: flex;
            flex-direction: column;
            width: 450px;
            height: auto;
            border-radius: 4px;
            overflow: contain;
            gap: 10px;
        }
        .capa-filme img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        /* 2ª DESCRIÇÃO LADO DIREITO*/
        .descricao {
            background-color: gray;
            display: flex;
            flex-direction: column;
            padding: 10px;
            width: 400px;
            height: auto;
            border-radius: 8px;
            gap: 15px;
        }
        .descricao ul li{
            list-style: none;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            margin: 5px;
            padding: 5px;
            align-items: center;
        }
        .descricao h3 {
            font-size: 12px;
            text-align: center;
        }
 
/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/        

/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/
        /*INICIO DO FOOTER*/

        footer {
            background-color: #141414;
            color: #808080;
            padding: 40px;
            margin-top: 40px;
            border: 1px solid #222;
        }

        /* ICONES */
        .icones-redes-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .icone img {
            width: 24px;
            height: 24px;
        }


        /* COLUNAS */
        .colunas-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            list-style: none;
            margin: 20px 0;
            padding: 0;
            gap: 20px;
        }
        .colunas-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .colunas-container li {
            margin-bottom: 10px;
            font-size: 12px;
        }
        footer a {
            color: #808080;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* BOTÃO */
        .btn {
            background-color: transparent;
            color: #808080;
            font-size: 12px;
            padding: 6px 10px;
            border: 1px solid #808080;
            margin-bottom: 10px;
        }
        .btn:hover {
            color: white;
            border-color: white;
        }
        footer h2 {
            font-size: 11px;
            font-weight: normal;
        }
/*/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////*/
    </style>
</head>
